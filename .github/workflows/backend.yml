name: Delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_DB: stutrade_test
          POSTGRES_USER: stutrade
          POSTGRES_PASSWORD: stutrade
        options: >-
          --health-cmd "pg_isready -U stutrade -d stutrade_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
        ports:
          - 5432:5432
    env:
      STUTRADE_TEST_DATABASE_URL: postgres://stutrade:stutrade@127.0.0.1:5432/stutrade_test?sslmode=disable
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            stu-trade
            stu-trade-engine
            stu-trade-web
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: Verify repositories and generated contracts
        run: make check
      - name: Run PostgreSQL integration tests
        run: make test-integration

  delivery:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            stu-trade
            stu-trade-engine
            stu-trade-web
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Assemble native delivery
        run: make native VERSION="${GITHUB_REF_NAME}" COMMIT="${GITHUB_SHA}"
      - name: Assemble production delivery
        run: make production VERSION="${GITHUB_REF_NAME}" COMMIT="${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-artifacts
          path: dist

  develop-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            stu-trade
            stu-trade-engine
            stu-trade-web
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Start develop assembly
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify backend and web
        run: |
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/ready
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:5173/
      - name: Show service logs
        if: failure()
        run: docker compose logs
      - name: Stop develop assembly
        if: always()
        run: docker compose down --volumes

  windows-smoke:
    needs: delivery
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: delivery-artifacts
          path: dist
      - name: Run native backend smoke test
        run: .\dist\native\backend\stu-trade.exe version
