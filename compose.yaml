name: stu-trade

services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: stutrade
      POSTGRES_USER: stutrade
      POSTGRES_PASSWORD: stutrade
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stutrade -d stutrade"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      target: develop
    command: ["go", "run", "./cmd/stu-trade", "serve", "--profile=develop"]
    environment:
      STUTRADE_DATABASE_URL: postgres://stutrade:stutrade@postgres:5432/stutrade?sslmode=disable
      STUTRADE_HTTP_ADDR: :8080
      STUTRADE_LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - go-cache:/go/pkg/mod

volumes:
  go-cache:
  postgres-data:
