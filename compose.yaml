name: stu-trade

services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: stutrade
      POSTGRES_USER: stutrade
      POSTGRES_PASSWORD: stutrade
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stutrade -d stutrade"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      target: develop
    command: ["go", "run", "./cmd/stu-trade", "serve", "--profile=develop"]
    environment:
      STUTRADE_DATABASE_URL: postgres://stutrade:stutrade@postgres:5432/stutrade?sslmode=disable
      STUTRADE_HTTP_ADDR: :8080
      STUTRADE_LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/health"]
      start_period: 60s
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - go-cache:/go/pkg/mod

  web:
    image: oven/bun:1.4.2-alpine
    working_dir: /workspace
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"]
    environment:
      VITE_BACKEND_URL: http://backend:8080
      VITE_ENABLE_MSW: "false"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./web:/workspace
      - web-node-modules:/workspace/node_modules

volumes:
  go-cache:
  postgres-data:
  web-node-modules:
